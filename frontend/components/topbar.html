<!-- ==========================================================
     FIC FURY TOPBAR
========================================================== -->

<header class="topbar">

    <!-- Left Section -->

    <div class="topbar-left">

        <!-- Mobile Menu -->

        <button
            id="menuButton"
            class="mobile-menu">

            <i class="fa-solid fa-bars"></i>

        </button>

        <!-- Breadcrumb -->

        <div class="breadcrumb">

            <h2 id="pageTitle">

                Dashboard

            </h2>

            <span>

                Welcome back to FIC FURY

            </span>

        </div>

    </div>

    <!-- Center Section -->

    <div class="topbar-center">

        <div class="search-box">

            <i class="fa-solid fa-search"></i>

            <input
                type="text"
                id="globalSearch"
                placeholder="Search committees, delegates, resources...">

        </div>

    </div>

    <!-- Right Section -->

    <div class="topbar-right">

        <!-- Notifications -->

        <button
            class="icon-btn"
            id="notificationButton">

            <i class="fa-solid fa-bell"></i>

            <span
                class="notification-count"
                id="notificationCount">

                3

            </span>

        </button>

        <!-- Theme Toggle -->

        <button
            class="icon-btn"
            id="themeToggle">

            <i class="fa-solid fa-moon"></i>

        </button>

        <!-- User Dropdown -->

        <div class="user-dropdown">

            <button
                id="userMenuButton"
                class="user-button">

                <div
                    class="avatar"
                    id="topbarAvatar">

                    AP

                </div>

                <div>

                    <h4
                        id="topbarUsername">

                        Loading...

                    </h4>

                    <span
                        id="topbarUserRole">

                        Delegate

                    </span>

                </div>

                <i
                    class="fa-solid fa-chevron-down"></i>

            </button>

            <!-- Dropdown -->

            <div
                id="userDropdown"
                class="dropdown-menu">

                <a href="profile.html">

                    <i class="fa-solid fa-user"></i>

                    My Profile

                </a>

                <a href="settings.html">

                    <i class="fa-solid fa-gear"></i>

                    Settings

                </a>

                <hr>

                <button id="logoutDropdown">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Logout

                </button>

            </div>

        </div>

    </div>

</header>
