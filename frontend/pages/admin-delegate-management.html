<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delegate Management | FIC FURY Admin</title>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/assets/layout.css">
    <link rel="stylesheet" href="../css/assets/responsive.css">
    <link rel="stylesheet" href="../css/assets/forms.css">
    <link rel="stylesheet" href="../css/assets/tables.css">
    <link rel="stylesheet" href="../css/assets/animations.css">
    <link rel="stylesheet" href="../css/assets/theme.css">
    <link rel="stylesheet" href="../css/assets/components.css">
    <link rel="stylesheet" href="../css/assets/toast.css">
    <link rel="stylesheet" href="../css/assets/utilities.css">
    <link rel="stylesheet" href="../css/assets/sidebar.css">
    <link rel="stylesheet" href="../css/admin-delegate-management.css">

</head>

<body>

<div class="app-layout">

    <div id="sidebar"></div>

    <main class="main-content">

        <section class="page-header">

            <div>

                <h1>Delegate Management</h1>

                <p>

                    Manage all registered delegates across every committee.

                </p>

            </div>

            <div class="page-header-right">


            </div>

        </section>

        <!-- Statistics -->

        <section class="stats-grid">

            <div class="stat-card">

                <h3>Total</h3>

                <span
                        class="stat-value"
                        id="totalDelegates">0</span>

            </div>

            <div class="stat-card">

                <h3>Pending</h3>

                <span
                        class="stat-value"
                        id="pendingDelegates">0</span>

            </div>

            <div class="stat-card">

                <h3>Approved</h3>

                <span
                        class="stat-value"
                        id="approvedDelegates">0</span>

            </div>

            <div class="stat-card">

                <h3>Rejected</h3>

                <span
                        class="stat-value"
                        id="rejectedDelegates">0</span>

            </div>

        </section>

        <!-- Filters -->

        <section class="panel">

            <div class="form-grid-3">

                <input

                        id="delegateSearch"

                        placeholder="Search delegate">

                <select id="committeeFilter">

                    <option value="">All Committees</option>

                </select>

                <select id="characterFilter">

                    <option value="">All Characters</option>

                </select>

                <select id="statusFilter">

                    <option value="">Workflow</option>

                    <option value="PENDING_ADMIN">Pending Admin</option>

                    <option value="PENDING_CHAIR">Pending Chair</option>

                    <option value="ACTIVE">Active</option>

                    <option value="COMPLETED">Completed</option>

                    <option value="REJECTED">Rejected</option>

                </select>

                <select id="chairReviewFilter">

                    <option value="">Chair Review</option>

                    <option value="PENDING">Pending</option>

                    <option value="APPROVED">Approved</option>

                    <option value="REJECTED">Rejected</option>

                </select>

                <select id="adminReviewFilter">

                    <option value="">Admin Review</option>

                    <option value="PENDING">Pending</option>

                    <option value="APPROVED">Approved</option>

                    <option value="REJECTED">Rejected</option>

                </select>

            </div>

        </section>

        <!-- Table -->

        <section class="panel">

            <div class="table-responsive">

                <table class="table">

                    <thead>

                    <tr>

                        <th>Delegate</th>

                        <th>Committee</th>

                        <th>Character</th>

                        <th>Workflow</th>

                        <th>Chair</th>

                        <th>Admin</th>

                        <th width="240">

                            Actions

                        </th>

                    </tr>

                    </thead>

                    <tbody id="delegateTableBody">

                    </tbody>

                </table>

            </div>

            <div id="pagination"

                 class="pagination">

            </div>

        </section>

    </main>

</div>

<!-- Drawer -->

<aside id="delegateDrawer"

       class="delegate-drawer">

    <div class="delegate-drawer-header">

        <h2>

            Delegate Details

        </h2>

        <button

                id="closeDrawer"

                class="btn-icon">

            ✕

        </button>

    </div>

    <div

            id="drawerContent"

            class="delegate-drawer-body">

    </div>

</aside>

<div id="drawerOverlay"

     class="drawer-overlay">

</div>

<!-- Edit Modal -->

<div

        id="delegateModal"

        class="modal hidden">

    <div class="modal-card">

        <h2>

            Edit Delegate

        </h2>

        <form id="delegateForm">

            <div class="form">

                <div class="form-group">

                    <label>

                        Committee

                    </label>

                    <select id="editCommittee">

                    </select>

                </div>

                <div class="form-group">

                    <label>

                        Character

                    </label>

                    <select id="editCharacter">

                    </select>

                </div>

                <div class="form-group">

                    <label>

                        Workflow

                    </label>

                    <select id="editWorkflow">

                        <option>PENDING_ADMIN</option>

                        <option>PENDING_CHAIR</option>

                        <option>ACTIVE</option>

                        <option>COMPLETED</option>

                        <option>REJECTED</option>

                    </select>

                </div>

                <div class="form-actions">

                    <button
                            type="button"
                            id="cancelEdit"
                            class="btn btn-secondary">

                        Cancel

                    </button>

                    <button
                            type="submit"
                            class="btn btn-success">

                        Save

                    </button>

                </div>

            </div>

        </form>

    </div>

</div>

<!-- Scripts -->

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/component-loader.js"></script>
<script src="../js/app.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/ui.js"></script>

<script src="../js/services/delegate-api.js"></script>
<script src="../js/services/committee-api.js"></script>
<script src="../js/services/character-api.js"></script>

<script src="../js/common/delegate-common.js"></script>
<script src="../js/common/delegate-filters.js"></script>
<script src="../js/common/delegate-table.js"></script>
<script src="../js/common/delegate-drawer.js"></script>
<script src="../js/common/delegate-export.js"></script>

<script src="../js/admin-delegate-management.js"></script>

</body>

</html>
