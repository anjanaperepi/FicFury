<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources | FIC FURY</title>

     <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Shared CSS -->

    

   

    <link
        rel="stylesheet"
        href="../css/dashboard.css">
    <link
        rel="stylesheet"
        href="../css/assets/layout.css">
    <link
        rel="stylesheet"
        href="../css/assets/responsive.css">
    <link
        rel="stylesheet"
        href="../css/assets/forms.css">
    <link
        rel="stylesheet"
        href="../css/assets/tables.css">
    <link
        rel="stylesheet"
        href="../css/assets/animations.css">
    <link
        rel="stylesheet"
        href="../css/assets/theme.css">
    <link
        rel="stylesheet"
        href="../css/assets/components.css">
    <link
        rel="stylesheet"
        href="../css/assets/toast.css">
    <link
        rel="stylesheet"
        href="../css/assets/utilities.css">
    <link
        rel="stylesheet"
        href="../css/assets/sidebar.css">
    <link
    rel="stylesheet"
    href="../css/chair-resources.css">

<body>

<div class="app-layout">

    <!-- Sidebar -->
    <div id="sidebar"></div>

    <main class="main-content">

        <!-- Header -->

        <div class="page-header">

            <div>

                <h1>
                    <i class="fa-solid fa-folder-open"></i>
                    Resources
                </h1>

                <p>
                    Upload and manage committee resources.
                </p>

            </div>

            <button
                id="openUploadModal"
                class="primary-btn">

                <i class="fa-solid fa-upload"></i>

                Upload Resource

            </button>

        </div>

        <!-- Filters -->

        <div class="resource-toolbar">

            <input
                type="text"
                id="searchInput"
                placeholder="Search resources...">

            <select id="committeeFilter">
                <option value="">All Committees</option>
            </select>

            <select id="statusFilter">

                <option value="">All Status</option>

                <option value="PENDING">
                    Pending
                </option>

                <option value="APPROVED">
                    Approved
                </option>

                <option value="REJECTED">
                    Rejected
                </option>

            </select>

        </div>

        <!-- Resource Cards -->

        <div
            id="resourceGrid"
            class="resource-grid">

        </div>

    <div id="footer"></div>
    
    </main>

</div>

<!-- Upload Modal -->

<div
    id="uploadModal"
    class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">

            <h2>

                Upload Resource

            </h2>

            <button
                id="closeModal">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <form
            id="uploadForm" class="form-container">

            <div class="form-group">

                <label>

                    Title

                </label>

                <input
                    id="title"
                    required>

            </div>

            <div class="form-group">

                <label>

                    Description

                </label>

                <textarea
                    id="description"
                    rows="4"></textarea>

            </div>

            <div class="form-group">

                <label>

                    Committee

                </label>

                <select
                    id="committee"
                    required>

                </select>

            </div>

            <div class="form-group">

                <label>

                    Category

                </label>

<select id="category">
    <option value="AGENDA">Agenda</option>
    <option value="BACKGROUND_GUIDE">Background Guide</option>
    <option value="POSITION_PAPER">Position Paper</option>
    <option value="RULES_OF_PROCEDURE">Rules of Procedure</option>
    <option value="PRESS_RELEASE">Press Release</option>
    <option value="PRESENTATION">Presentation</option>
    <option value="RESEARCH_MATERIAL">Research Material</option>
    <option value="MAP">Map</option>
    <option value="OTHER">Other</option>
</select>

            </div>

            <div class="form-group">

                <label>

                    Version

                </label>

                <input
                    id="version"
                    type="number"
                    min="1"
                    value="1">

            </div>

            <div class="form-group">

                <label>

                    Upload File

                </label>

                <input
                    type="file"
                    id="file">

            </div>

            <div class="form-group">

                <label>

                    External Link

                </label>

                <input
                    id="externalLink">

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    id="cancelUpload"
                    class=" btn btn-secondary">

                    Cancel

                </button>

                <button
                    type="submit"
                    class=" btn btn-primary">

                    Upload

                </button>

            </div>

        </form>

    </div>

</div>

<script src="../js/config.js"></script>

<script src="../js/utils.js"></script>

<script src="../js/api.js"></script>

<script src="../js/auth.js"></script>

<script src="../js/component-loader.js"></script>
<script src="../js/app.js"></script>

<script src="../js/sidebar.js"></script>
<script src="../js/chair-resources.js"></script>

</body>
</html>
