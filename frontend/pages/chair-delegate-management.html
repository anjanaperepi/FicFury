<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Chair Delegate Management | FIC FURY</title>
 <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link
        rel="stylesheet"
        href="../css/assets/layout.css">
    <link
        rel="stylesheet"
        href="../css/assets/responsive.css">
    <link
        rel="stylesheet"
        href="../css/assets/forms.css">
    <link
        rel="stylesheet"
        href="../css/assets/tables.css">
    <link
        rel="stylesheet"
        href="../css/assets/animations.css">
    <link
        rel="stylesheet"
        href="../css/assets/theme.css">
    <link
        rel="stylesheet"
        href="../css/assets/components.css">
    <link
        rel="stylesheet"
        href="../css/assets/toast.css">
    <link
        rel="stylesheet"
        href="../css/assets/utilities.css">
    <link
        rel="stylesheet"
        href="../css/assets/sidebar.css">
    <link rel="stylesheet" href="../css/delegate-management.css">

</head>

<body>

<div class="app-layout">

    <!-- Sidebar -->
    <div id="sidebar"></div>

    <main class="main-content">

        <!-- ========================= -->
        <!-- Page Header -->
        <!-- ========================= -->

        <section class="page-header">

            <div>

                <h1>Delegate Management</h1>

                <p>
                    Review and manage delegates
                    assigned to your committees.
                </p>

            </div>

        </section>


        <!-- ========================= -->
        <!-- Statistics -->
        <!-- ========================= -->

        <section class="stats-grid">

            <div class="stat-card">

                <h3>Total</h3>

                <span id="totalDelegates">0</span>

            </div>

            <div class="stat-card">

                <h3>Pending</h3>

                <span id="pendingDelegates">0</span>

            </div>

            <div class="stat-card">

                <h3>Approved</h3>

                <span id="approvedDelegates">0</span>

            </div>

            <div class="stat-card">

                <h3>Rejected</h3>

                <span id="rejectedDelegates">0</span>

            </div>

        </section>


        <!-- ========================= -->
        <!-- Filters -->
        <!-- ========================= -->

        <section class="filter-card">

            <div class="filter-grid">

                <input

                    id="delegateSearch"

                    class="form-control"

                    placeholder="Search delegate..."

                >

                <select
                        id="committeeFilter"
                        class="form-control">

                    <option value="">

                        All Committees

                    </option>

                </select>

                <select
                        id="characterFilter"
                        class="form-control">

                    <option value="">

                        All Characters

                    </option>

                </select>

                <select
                        id="statusFilter"
                        class="form-control">

                    <option value="">All Status</option>

                    <option value="PENDING_CHAIR">
                        Pending Chair
                    </option>

                    <option value="ACTIVE">
                        Active
                    </option>

                    <option value="COMPLETED">
                        Completed
                    </option>

                    <option value="REJECTED">
                        Rejected
                    </option>

                </select>

                <button

                        id="exportDelegates"

                        class="btn btn-primary">

                    Export

                </button>

            </div>

        </section>


        <!-- ========================= -->
        <!-- Table -->
        <!-- ========================= -->

        <section class="table-responsive">

            <table class="table">

                <thead>

                <tr>

                    <th>Delegate</th>

                    <th>Committee</th>

                    <th>Character</th>

                    <th>Workflow</th>

                    <th>Chair</th>

                    <th>Admin</th>

                    <th>Actions</th>

                </tr>

                </thead>

                <tbody id="delegateTableBody" class = "table tbody">

                </tbody>

            </table>

            <div

                    id="emptyState"

                    class="table-empty">

                No delegates found.

            </div>

            <div

                    id="pagination"

                    class="pagination">

            </div>

        </section>
<div id = "footer"></div>
    </main>

</div>


<!-- ======================================= -->
<!-- Drawer -->
<!-- ======================================= -->

<aside id="delegateDrawer" class="delegate-drawer">

    <div class="delegate-drawer-header">

        <h2>Delegate Details</h2>

        <button
            id="closeDrawer"
            class="btn-icon">

            ✕

        </button>

    </div>

    <div
        id="drawerContent"
        class="delegate-drawer-body">

    </div>

</aside>

<div
    id="drawerOverlay"
    class="drawer-overlay">

</div>



<!-- ======================================= -->
<!-- Scripts -->
<!-- ======================================= -->

<script src="../js/config.js"></script>

<script src="../js/utils.js"></script>

<script src="../js/api.js"></script>

<script src="../js/auth.js"></script>

<script src="../js/component-loader.js"></script>

<script src="../js/app.js"></script>

<script src="../js/sidebar.js"></script>

<script src="../js/ui.js"></script>

<script src="../js/services/delegate-api.js"></script>

<script src="../js/services/committee-api.js"></script>

<script src="../js/services/character-api.js"></script>

<script src="../js/common/delegate-common.js"></script>

<script src="../js/common/delegate-filters.js"></script>

<script src="../js/common/delegate-table.js"></script>

<script src="../js/common/delegate-drawer.js"></script>

<script src="../js/chair-delegate-management.js"></script>

<script src="../js/common/delegate-export.js"></script>



</body>

</html>
